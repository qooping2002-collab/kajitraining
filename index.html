<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親子家事トレーニングAI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#f26a7a;--pink-l:#fde8eb;--pink-d:#c44a5a;
  --orange:#f5924e;--green:#4caf7d;--green-l:#e8f7ee;
  --purple:#9b6bc7;--purple-l:#f3eeff;
  --bg:#fdf8f5;--card:#fff;--text:#2a1f16;--muted:#8a7060;
  --radius:16px;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,var(--pink-l),#fff9f7);padding:1.2rem 1rem 1rem;text-align:center;border-bottom:2px solid var(--pink-l)}
.header .badge{display:inline-block;background:var(--pink);color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:20px;margin-bottom:6px;letter-spacing:0.05em}
.header h1{font-size:1.4rem;font-weight:900;color:var(--text);line-height:1.3}
.header h1 span{color:var(--pink)}
.header p{font-size:0.82rem;color:var(--muted);margin-top:4px}

/* FORM */
.form-wrap{padding:1rem}
.section-card{background:var(--card);border-radius:var(--radius);padding:1.1rem;margin-bottom:1rem;box-shadow:0 2px 12px rgba(242,106,122,0.08)}
.section-label{display:flex;align-items:center;gap:6px;font-size:0.88rem;font-weight:700;color:var(--text);margin-bottom:0.7rem}
.section-label .icon{font-size:1rem}

/* GRADE */
.grade-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:0.6rem}
.grade-tab{padding:0.5rem;border:2px solid var(--pink-l);border-radius:10px;background:#fff;font-size:0.85rem;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;transition:all 0.2s}
.grade-tab.active{background:var(--pink);border-color:var(--pink);color:#fff}
.grade-detail{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grade-btn{padding:0.4rem;border:1.5px solid var(--pink-l);border-radius:8px;background:#fff;font-size:0.8rem;color:var(--muted);cursor:pointer;text-align:center;transition:all 0.2s}
.grade-btn.active{background:var(--pink-l);border-color:var(--pink);color:var(--pink-d);font-weight:700}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:0.35rem 0.75rem;border:1.5px solid var(--pink-l);border-radius:20px;background:#fff;font-size:0.8rem;color:var(--muted);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.chip.active{background:var(--pink-l);border-color:var(--pink);color:var(--pink-d);font-weight:700}
.chip.multi.active{background:var(--green-l);border-color:var(--green);color:#2d7a56;font-weight:700}

/* INPUT */
textarea,input[type=text]{width:100%;border:1.5px solid var(--pink-l);border-radius:10px;padding:0.6rem 0.8rem;font-family:inherit;font-size:0.85rem;color:var(--text);background:#fff;resize:none;outline:none;transition:border 0.2s}
textarea:focus,input[type=text]:focus{border-color:var(--pink)}

/* SUBMIT */
.submit-btn{width:100%;background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff;border:none;border-radius:50px;padding:1rem;font-family:inherit;font-size:1rem;font-weight:900;cursor:pointer;margin-top:0.5rem;box-shadow:0 4px 16px rgba(242,106,122,0.35);transition:opacity 0.2s;letter-spacing:0.03em}
.submit-btn:hover{opacity:0.9}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed}

/* COUNTER */
.usage-counter{text-align:center;font-size:0.78rem;color:var(--muted);margin-top:0.7rem}
.usage-counter b{color:var(--pink-d);font-weight:700}
.limit-msg{background:var(--purple-l);border-radius:12px;padding:0.9rem 1rem;margin-top:0.8rem;font-size:0.83rem;color:var(--purple);line-height:1.7;text-align:center}
.limit-msg .limit-title{font-weight:700;margin-bottom:0.3rem}

/* RESULT */
.result-wrap{padding:0 1rem 2rem;display:none}
.result-card{background:var(--card);border-radius:var(--radius);padding:1.3rem;box-shadow:0 2px 16px rgba(242,106,122,0.10)}
.result-header{display:flex;align-items:center;gap:8px;margin-bottom:0.8rem;padding-bottom:0.6rem;border-bottom:2px solid var(--pink-l)}
.result-header .icon{font-size:1.2rem}
.result-header h2{font-size:0.95rem;font-weight:700;color:var(--pink-d)}
.result-body{font-size:0.88rem;line-height:1.9;color:var(--text)}
.result-body h3{font-size:0.92rem;font-weight:700;color:var(--pink-d);margin:0.8rem 0 0.3rem}
.result-body strong{color:var(--pink-d)}
.result-body ul{padding-left:1.2rem;margin:0.3rem 0}
.result-body li{margin-bottom:0.2rem}

/* TIP */
.tip-box{background:var(--purple-l);border-radius:12px;padding:0.8rem 1rem;margin-top:0.8rem;font-size:0.8rem;color:var(--purple);line-height:1.7}
.tip-box .tip-title{font-weight:700;margin-bottom:0.3rem}

/* RETRY */
.retry-btn{width:100%;background:#fff;color:var(--pink);border:2px solid var(--pink);border-radius:50px;padding:0.8rem;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:1rem;transition:all 0.2s}
.retry-btn:hover{background:var(--pink-l)}
.retry-btn:disabled{opacity:0.5;cursor:not-allowed;border-color:var(--muted);color:var(--muted)}

/* LOADING */
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:0.9rem}
.loading .dots{display:inline-flex;gap:4px;margin-top:8px}
.loading .dot{width:8px;height:8px;background:var(--pink);border-radius:50%;animation:bounce 1.2s infinite}
.loading .dot:nth-child(2){animation-delay:0.2s}
.loading .dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

.error-box{background:#fff0f0;border:1.5px solid #ffcccc;border-radius:12px;padding:1rem;color:#c44a5a;font-size:0.85rem;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <div class="badge">🎁 ニコの片付け習慣術 特典</div>
  <h1>親子<span>家事</span>トレーニング<span>AI</span></h1>
  <p>子どもの様子を選ぶだけで！AIが今日のぴったりメニューを提案します✨</p>
</div>

<div class="form-wrap" id="formWrap">

  <!-- 学年 -->
  <div class="section-card">
    <div class="section-label"><span class="icon">🎒</span>学年を選んでね</div>
    <div class="grade-tabs">
      <button class="grade-tab active" onclick="switchGroup('小学生')">🌸 小学生</button>
      <button class="grade-tab" onclick="switchGroup('中学生')">⚡ 中学生</button>
    </div>
    <div class="grade-detail" id="gradeDetail"></div>
  </div>

  <!-- 今日の様子 -->
  <div class="section-card">
    <div class="section-label"><span class="icon">😊</span>今日の子供の様子は？</div>
    <div class="chips" id="moodChips">
      <button class="chip" onclick="toggle(this,'mood')">😄 元気いっぱい</button>
      <button class="chip" onclick="toggle(this,'mood')">😐 普通・まあまあ</button>
      <button class="chip" onclick="toggle(this,'mood')">😴 疲れ気味</button>
      <button class="chip" onclick="toggle(this,'mood')">😤 機嫌が悪い</button>
      <button class="chip" onclick="toggle(this,'mood')">📚 テスト前</button>
      <button class="chip" onclick="toggle(this,'mood')">⚽ 部活疲れ</button>
    </div>
  </div>

  <!-- 時間 -->
  <div class="section-card">
    <div class="section-label"><span class="icon">⏰</span>使える時間は？</div>
    <div class="chips" id="timeChips">
      <button class="chip" onclick="toggle(this,'time')">⚡ 5分以内</button>
      <button class="chip" onclick="toggle(this,'time')">🕐 10分</button>
      <button class="chip" onclick="toggle(this,'time')">🕑 15〜20分</button>
      <button class="chip" onclick="toggle(this,'time')">🕒 30分以上</button>
    </div>
  </div>

  <!-- 家事カテゴリ -->
  <div class="section-card">
    <div class="section-label"><span class="icon">🏠</span>練習したい家事（複数OK）</div>
    <div class="chips" id="categoryChips">
      <button class="chip multi" onclick="toggleMulti(this)">🧹 片付け</button>
      <button class="chip multi" onclick="toggleMulti(this)">🍳 料理</button>
      <button class="chip multi" onclick="toggleMulti(this)">👕 洗濯</button>
      <button class="chip multi" onclick="toggleMulti(this)">🫧 掃除</button>
      <button class="chip multi" onclick="toggleMulti(this)">🗑️ ゴミ出し</button>
      <button class="chip multi" onclick="toggleMulti(this)">🍽️ 食器片付け</button>
      <button class="chip multi" onclick="toggleMulti(this)">✨ その他</button>
    </div>
    <input type="text" id="freeInput" placeholder="例：窓拭き、玄関掃除　など" style="margin-top:8px">
  </div>

  <!-- 得意・苦手 -->
  <div class="section-card">
    <div class="section-label"><span class="icon">💬</span>今日の状況をひとこと（任意）</div>
    <textarea id="situation" rows="2" placeholder="例：急いでいる、やる気満々、料理が苦手　など"></textarea>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submit()">✨ 今日の家事を提案してもらう！</button>
  <div class="usage-counter" id="usageCounter"></div>
  <div class="limit-msg" id="limitMsg" style="display:none">
    <div class="limit-title">🌙 今日はここまで！</div>
    <div>今日の提案は終わりです。また明日、新しい家事にチャレンジしてね♪<br>（毎日5回まで使えます）</div>
  </div>
</div>

<!-- 結果エリア -->
<div class="result-wrap" id="resultWrap">
  <div id="loadingArea" class="loading">
    <div>AIが考え中です…</div>
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
  <div class="result-card" id="resultCard" style="display:none">
    <div class="result-header">
      <span class="icon">🌟</span>
      <h2>今日のおすすめ家事メニュー</h2>
    </div>
    <div class="result-body" id="resultBody"></div>
    <div class="tip-box">
      <div class="tip-title">💡 使い方のコツ</div>
      <div id="tipText">小学生はお子さんと一緒に画面を見ながら「今日はどれにする？」と声かけを。中学生は自分でやってみるのがおすすめ！自分で選ぶことで、主体的に動く習慣が育ちます♪</div>
    </div>
  </div>
  <div id="errorArea" class="error-box" style="display:none"></div>
  <button class="retry-btn" id="retryBtn" style="display:none" onclick="retry()">🔄 もう一度提案してもらう</button>
  <button class="retry-btn" style="margin-top:0.5rem;border-color:var(--muted);color:var(--muted)" onclick="reset()">← 最初からやり直す</button>
</div>

<script>
let gradeGroup = '小学生';
let selectedGrade = '';
let selectedMood = '';
let selectedTime = '';
let selectedCategories = [];

const gradeMap = {
  '小学生': ['小1','小2','小3','小4','小5','小6'],
  '中学生': ['中1','中2','中3']
};

/* ===== 1日の利用上限（毎日5回） ===== */
const DAILY_LIMIT = 5;

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getUsedCount() {
  try {
    const raw = localStorage.getItem('kaji_usage');
    if (!raw) return 0;
    const obj = JSON.parse(raw);
    if (obj.date !== todayKey()) return 0; // 日付が変わったらリセット
    return obj.count || 0;
  } catch(e) {
    return 0;
  }
}

function addUsedCount() {
  let count = getUsedCount() + 1;
  try {
    localStorage.setItem('kaji_usage', JSON.stringify({date: todayKey(), count: count}));
  } catch(e) {}
  updateUsageUI();
}

function remaining() {
  return Math.max(0, DAILY_LIMIT - getUsedCount());
}

function updateUsageUI() {
  const rem = remaining();
  const counter = document.getElementById('usageCounter');
  const submitBtn = document.getElementById('submitBtn');
  const limitMsg = document.getElementById('limitMsg');
  const retryBtn = document.getElementById('retryBtn');

  if (rem > 0) {
    counter.innerHTML = `今日はあと <b>${rem}</b> 回つかえます`;
    counter.style.display = 'block';
    submitBtn.disabled = false;
    limitMsg.style.display = 'none';
    if (retryBtn) retryBtn.disabled = false;
  } else {
    counter.style.display = 'none';
    submitBtn.disabled = true;
    limitMsg.style.display = 'block';
    if (retryBtn) retryBtn.disabled = true;
  }
}

function switchGroup(group) {
  gradeGroup = group;
  selectedGrade = '';
  document.querySelectorAll('.grade-tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && group==='小学生') || (i===1 && group==='中学生'));
  });
  renderGradeDetail();
}

function renderGradeDetail() {
  const el = document.getElementById('gradeDetail');
  el.innerHTML = gradeMap[gradeGroup].map(g =>
    `<button class="grade-btn${selectedGrade===g?' active':''}" onclick="selectGrade('${g}')">${g}</button>`
  ).join('');
}

function selectGrade(g) {
  selectedGrade = g;
  renderGradeDetail();
}

function toggle(el, type) {
  const wasActive = el.classList.contains('active');
  document.querySelectorAll(`#${type==='mood'?'mood':'time'}Chips .chip`).forEach(c => c.classList.remove('active'));
  if (!wasActive) {
    el.classList.add('active');
    if (type==='mood') selectedMood = el.textContent.trim();
    else selectedTime = el.textContent.trim();
  } else {
    if (type==='mood') selectedMood = '';
    else selectedTime = '';
  }
}

function toggleMulti(el) {
  el.classList.toggle('active');
  const txt = el.textContent.trim();
  if (el.classList.contains('active')) {
    if (!selectedCategories.includes(txt)) selectedCategories.push(txt);
  } else {
    selectedCategories = selectedCategories.filter(c => c !== txt);
  }
}

function md2html(text) {
  return text
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/^# (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^[\-\*] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*<\/li>)/, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hul])/gm, '')
    .trim();
}

async function submit() {
  if (remaining() <= 0) { updateUsageUI(); return; }
  if (!selectedGrade) { alert('学年を選んでね！'); return; }
  if (!selectedMood) { alert('今日の様子を選んでね！'); return; }
  if (!selectedTime) { alert('使える時間を選んでね！'); return; }

  const categories = selectedCategories.length > 0 ? selectedCategories.join('・') : '何でもOK';
  const free = document.getElementById('freeInput').value.trim();
  const situation = document.getElementById('situation').value.trim();

  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('loadingArea').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('errorArea').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'none';

  const isJunior = gradeGroup === '中学生';

  const systemPrompt = isJunior
    ? `あなたは中学生の家事トレーニングをサポートするAIです。中学生が自分で考えて行動できるよう、自立を促す提案をしてください。難しすぎず、でも「自分でできた！」という達成感が得られる家事を提案します。反抗期でも取り組みやすいよう、押しつけがましくなく、選択肢を与えるような提案を心がけてください。`
    : `あなたは小学生の家事トレーニングをサポートするAIです。子どもが楽しく取り組めるよう、ゲーム感覚で楽しめる家事を提案してください。1日5分・小さい範囲・一気にやらない、というニコメソッドに基づいて提案します。できた！を褒める声かけ例も添えてください。回答の最後に「使い方のコツ」は絶対に書かないこと。`;

  const userPrompt = `
学年：${selectedGrade}（${gradeGroup}）
今日の様子：${selectedMood}
使える時間：${selectedTime}
練習したい家事：${categories}${free ? `（具体的に：${free}）` : ''}
${situation ? `今日の状況：${situation}` : ''}

上記の条件に合わせて、今日ぴったりの家事トレーニングメニューを提案してください。
・具体的にどんな家事をするか
・所要時間の目安
・取り組み方のコツ（子供の年齢に合わせて）
・できたときの声かけ例
を含めて、親しみやすい文体で提案してください。`;

  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{role:'user', content: userPrompt}]
      })
    });

    if (!res.ok) throw new Error(`サーバーエラー: ${res.status}`);
    const data = await res.json();
    const text = data.content?.[0]?.text || '';

    // 成功したときだけ回数を消費
    addUsedCount();

    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('retryBtn').style.display = 'block';
    updateUsageUI();

    // 学年に応じてコツを変更
    document.getElementById('tipText').textContent = isJunior
      ? '中学生は自分で選んで自分でやってみるのがおすすめ！自分で決めることで、主体的に動く習慣が育ちます♪'
      : 'お子さんと一緒に画面を見ながら「今日はどれにする？」と声かけを。一緒に選ぶことで、自分で決めて動ける力が育ちます♪';

    const html = md2html(text);
    document.getElementById('resultBody').innerHTML = `<p>${html}</p>`;

  } catch(e) {
    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('errorArea').style.display = 'block';
    document.getElementById('errorArea').textContent = `エラーが発生しました。もう一度お試しください。（${e.message}）`;
    document.getElementById('retryBtn').style.display = 'block';
  }
}

function retry() {
  if (remaining() <= 0) { 
    document.getElementById('resultWrap').style.display = 'none';
    document.getElementById('formWrap').style.display = 'block';
    updateUsageUI();
    return; 
  }
  document.getElementById('resultWrap').style.display = 'none';
  document.getElementById('formWrap').style.display = 'block';
}

function reset() {
  selectedGrade = '';
  selectedMood = '';
  selectedTime = '';
  selectedCategories = [];
  document.querySelectorAll('.chip, .chip.multi').forEach(c => c.classList.remove('active'));
  document.getElementById('freeInput').value = '';
  document.getElementById('situation').value = '';
  switchGroup('小学生');
  document.getElementById('resultWrap').style.display = 'none';
  document.getElementById('formWrap').style.display = 'block';
  updateUsageUI();
}

// 初期化
renderGradeDetail();
updateUsageUI();
</script>
</body>
</html>
